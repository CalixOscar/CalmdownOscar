<!doctype html>
<!-- Cover page template for /playground/forslag/<slug>/index.html. Replace every {{...}} placeholder. -->
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#09191d">
  <title>Forslag · {{BEDRIFT}}</title>
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <style>
    :root{--fjord:#09191d;--sea:#87b6a8;--stone:#ecebe0;--paper:#f5f4ed;--ink:#142529;--muted:#5d6d70;--line:rgba(20,37,41,.18);--sans:'Avenir Next',Avenir,'Segoe UI',Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .wrap{width:min(100% - 32px,1120px);margin-inline:auto}
    header{background:var(--fjord);color:var(--stone);padding:56px 0 60px}
    .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sea);margin:0 0 30px}
    h1{font-weight:300;letter-spacing:-.04em;line-height:1.05;font-size:clamp(38px,6.5vw,68px);margin:0;max-width:16ch}
    header p{max-width:560px;color:rgba(236,235,224,.78);margin:22px 0 0}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:56px 0 24px}
    figure{margin:0}
    figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
    figcaption b{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
    figcaption a{font-size:12px;color:var(--muted)}
    .shot{display:block;border:1px solid var(--line);background:#fff;aspect-ratio:16/10;overflow:hidden}
    .shot img{width:100%;height:100%;object-fit:cover;object-position:top}
    .after .shot{border-color:var(--ink);box-shadow:0 18px 40px rgba(9,25,29,.18)}
    .cta{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;padding:20px 0 64px}
    .button{display:inline-flex;gap:14px;align-items:center;background:var(--ink);color:var(--stone);padding:14px 22px;text-decoration:none;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
    .button:hover{background:#638f81}
    .cta p{margin:0;color:var(--muted);font-size:14px;max-width:520px}
    footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:13px;color:var(--muted)}
    @media(max-width:760px){.compare{grid-template-columns:1fr;gap:36px}header{padding:40px 0 44px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">Nettsideforslag · {{STED}}</p>
      <h1>Ny nettside for {{BEDRIFT}}.</h1>
      <p>{{EN_TIL_TO_SETNINGER_OM_HVA_FORSLAGET_LØSER}}</p>
    </div>
  </header>
  <main class="wrap">
    <div class="compare">
      <figure>
        <figcaption><b>I dag</b><a href="{{GAMMEL_URL}}" target="_blank" rel="noopener noreferrer">{{GAMMEL_DOMENE}} ↗</a></figcaption>
        <a class="shot" href="{{GAMMEL_URL}}" target="_blank" rel="noopener noreferrer"><img src="assets/for.jpg" alt="Dagens nettside for {{BEDRIFT}}"></a>
      </figure>
      <figure class="after">
        <figcaption><b>Forslag</b><a href="nettside/">Åpne forslaget ↗</a></figcaption>
        <a class="shot" href="nettside/"><img src="assets/etter.jpg" alt="Forslag til ny nettside for {{BEDRIFT}}"></a>
      </figure>
    </div>
    <div class="cta">
      <a class="button" href="nettside/">Se hele forslaget <span aria-hidden="true">↗</span></a>
      <p>Forslaget er et utkast laget for {{BEDRIFT}}. Ingenting er publisert eller endret på dagens nettside.</p>
    </div>
  </main>
  <footer><div class="wrap">Peter A. Sparr Christensen · <a href="mailto:peter@calmdownoscar.com">peter@calmdownoscar.com</a></div></footer>
</body>
</html>

@media (prefers-color-scheme: light){
  :root{ --bg:#f6f3ff; --card:#ffffff; --card2:#ece7ff; --ink:#1d1740; --mute:#5d5791; --good:#119a62; --bad:#d0335a; --accent:#b97800; --line:#d5ccf5; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding-top:16px}
h1{font-size:26px;margin:4px 0 2px}
h2{font-size:20px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-weight:700;font-size:18px;background:var(--accent);color:#1d1740;margin:10px 0}
.big.alt{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.big small{display:block;font-weight:500;opacity:.8;font-size:14px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;position:relative;overflow:hidden}
.tile .e{font-size:26px}
.tile b{display:block;margin-top:2px}
.tile small{color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .bar{flex:1;height:10px;margin:0}
.x{background:none;border:0;font-size:22px;color:var(--mute);padding:4px 8px}
.chip{display:inline-block;background:var(--card2);color:var(--mute);border-radius:99px;padding:3px 10px;font-size:13px;margin-bottom:10px}
.q{font-size:22px;font-weight:700;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;font-size:17px}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0;background:var(--card)}
.fb.good{border-left:6px solid var(--good)}
.fb.bad{border-left:6px solid var(--bad)}
.fb .h{color:var(--accent);margin-top:6px}
.hud{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:4px}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.04)}}
.score{font-size:54px;font-weight:800;text-align:center;margin:8px 0 0}
.center{text-align:center}
.miss{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.miss b{color:var(--good)}
.hidden{display:none}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:26px}
</style>
</head>

let S=null; // sample-exam state
function sampleStart(){
  S={i:0,right:0,missed:[],shown:false};
  sampleShow();
}
function sampleShow(){
  const q=SAMPLE[S.i]; S.shown=false;
  $.innerHTML=`
    <div class="top"><button class="x" data-a="home" aria-label="Back">✕</button><div class="bar"><i style="width:${S.i/SAMPLE.length*100}%"></i></div></div>
    <div class="hud"><span>${esc(q[0])}</span><span>${S.i+1} / ${SAMPLE.length}</span></div>
    <div class="q" style="font-size:26px;margin-top:20px">${esc(q[1])}</div>
    ${q[3]?`<div>${q[3].map(o=>`<div class="miss" style="font-size:20px">${esc(o)}</div>`).join('')}</div>`:''}
    <div id="sa"><button class="big alt" data-a="sreveal">Show answer (reader only)</button></div>`;
}
function sampleReveal(){
  const q=SAMPLE[S.i]; S.shown=true;
  document.getElementById('sa').innerHTML=`
    <div class="fb good"><b>${esc(q[2])}</b></div>
    <button class="big" data-a="sright">✓ She got it</button>
    <button class="big alt" data-a="swrong">✗ Missed</button>`;
}
function sampleMark(ok){
  if(ok) S.right++; else S.missed.push(S.i);
  S.i++;
  if(S.i<SAMPLE.length) sampleShow(); else sampleEnd();
}
function sampleEnd(){
  const n=SAMPLE.length, pct=Math.round(S.right/n*100);
  $.innerHTML=`
    <div class="score">${S.right}/${n}</div>
    <p class="center sub">${pct}%</p>
    ${S.missed.length?`<h2>Go over these:</h2>${S.missed.map(i=>`<div class="miss">${esc(SAMPLE[i][1])}<br><b>${esc(SAMPLE[i][2])}</b></div>`).join('')}`:'<p class="center">Perfect! 🎉</p>'}
    <button class="big" data-a="sstart">Run it again</button>
    <button class="big alt" data-a="home">Back to the quiz</button>`;
}

/* ---------- STATE ---------- */
const KEY='bianca-exam-v1';
let mem={st:{},best:0};
try{ mem=Object.assign(mem,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){} }

const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const tname=id=>TOPICS.find(t=>t.id===id);

let R=null; // current round

/* ---------- HOME ---------- */
function stats(ids){
  const idx=ids||C.map((_,i)=>i);
  let ok=0,bad=0;
  idx.forEach(i=>{const s=mem.st[i]; if(s==='o')ok++; else if(s==='x')bad++;});
  return {ok,bad,total:idx.length,fresh:idx.length-ok-bad};
}
function home(){
  R=null;
  const all=stats();
  const pct=Math.round(all.ok/all.total*100);
  $.innerHTML=`
    <h1>World Religions Quiz</h1>
    <p class="sub">Quick rounds. Get one wrong and it comes back.</p>
    <div class="stats">
      <div class="stat"><b>${pct}%</b><span>mastered</span></div>
      <div class="stat"><b>${all.bad}</b><span>weak spots</span></div>
      <div class="stat"><b>${mem.best}</b><span>best streak</span></div>
    </div>
    <button class="big" data-a="smart">▶ Start a smart round<small>10 cards: weak spots first, then new ones</small></button>
    <button class="big alt" data-a="mock">📝 Mock exam<small>30 random questions across everything</small></button>
    ${all.bad?`<button class="big alt" data-a="weak">🎯 Fix my ${all.bad} weak spots</button>`:''}
    <h2 style="margin-top:20px">Pick a topic</h2>
    <div class="grid">${TOPICS.map(t=>{
      const ids=C.map((c,i)=>c[0]===t.id?i:-1).filter(i=>i>=0);
      const s=stats(ids);
      return `<button class="tile" data-a="topic" data-t="${t.id}"><span class="e">${t.e}</span><b>${esc(t.n)}</b><small>${s.ok}/${s.total} mastered</small><div class="bar"><i style="width:${s.ok/s.total*100}%"></i></div></button>`;
    }).join('')}</div>
    <button class="big alt" data-a="reset" style="margin-top:22px;font-size:14px;padding:10px">Reset my progress</button>
    <footer>${C.length} questions from your teacher's slides and quiz bee. Good luck, Bianca! 💜<br><a href="#sample-exam" data-a="sstart" style="color:var(--mute);opacity:.6;text-decoration:none;display:inline-block;margin-top:14px">🔖 Sample exam</a></footer>`;
}

/* ---------- ROUND ---------- */
function startRound(ids,label,size){
  const pool=shuffle(ids).slice(0,size||10);
  if(!pool.length){ home(); return; }
  R={queue:pool.slice(),total:pool.length,first:{},streak:0,xp:0,label,missed:[],answered:false,done:0};
  question();
}
function options(i){
  const c=C[i];
  if(c[4]) return shuffle([c[2],...shuffle(c[4]).slice(0,3)]);
  let cand=C.map((x,j)=>j).filter(j=>j!==i && C[j][2]!==c[2]);
  const same=cand.filter(j=>C[j][0]===c[0]);
  if(same.length>=3) cand=same;
  const L=c[2].length;
  cand=cand.map(j=>({j,d:Math.abs(C[j][2].length-L)+Math.random()*12})).sort((a,b)=>a.d-b.d).slice(0,8).map(o=>o.j);
  const seen=new Set([c[2]]), picks=[];
  for(const j of shuffle(cand)){ if(!seen.has(C[j][2])){seen.add(C[j][2]);picks.push(C[j][2]);} if(picks.length===3)break; }
  return shuffle([c[2],...picks]);
}
function question(){
  const i=R.queue[0], c=C[i], t=tname(c[0]);
  R.opts=options(i); R.answered=false;
  const pct=Math.round(R.done/R.total*100);
  $.innerHTML=`
    <div class="top"><button class="x" data-a="home" aria-label="Quit">✕</button><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="hud"><span>🔥 ${R.streak} streak</span><span>⭐ ${R.xp} XP</span></div>
    <span class="chip">${t.e} ${esc(t.n)}</span>
    <div class="q">${esc(c[1])}</div>
    <div id="opts">${R.opts.map((o,k)=>`<button class="opt" data-a="pick" data-k="${k}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>`;
}
function pick(k){
  if(R.answered) return;
  R.answered=true;
  const i=R.queue[0], c=C[i], good=R.opts[k]===c[2];
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,n)=>{b.disabled=true; if(R.opts[n]===c[2]) b.classList.add('right');});
  if(!good){ btns[k].classList.add('wrong'); try{navigator.vibrate&&navigator.vibrate(60);}catch(e){} }
  const firstTime=!(i in R.first);
  if(firstTime){ R.first[i]=good; }
  if(good){
    R.streak++; R.xp+=10+Math.min(R.streak,10);
    if(R.streak>mem.best) mem.best=R.streak;
    mem.st[i]=firstTime?'o':(mem.st[i]||'x');
    R.queue.shift(); if(firstTime) R.done++; else R.done++;
  }else{
    R.streak=0; mem.st[i]='x';
    if(!R.missed.includes(i)) R.missed.push(i);
    R.queue.shift();
    R.queue.splice(Math.min(3,R.queue.length),0,i); // comes back in a few cards
  }
  save();
  const last=R.queue.length===0;
  document.getElementById('fb').innerHTML=`
    <div class="fb ${good?'good':'bad'} pop">
      <b>${good?['Yes! ','Nailed it! ','Correct! ','Boom! '][Math.floor(Math.random()*4)]:'Not quite. '}</b>${good?'':`The answer is <b>${esc(c[2])}</b>.`}
      ${c[3]?`<div class="h">💡 ${esc(c[3])}</div>`:''}
    </div>
    <button class="big" data-a="next">${last?'See my score':'Next'}</button>`;
  document.querySelector('[data-a=next]').focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){ if(R.queue.length) question(); else finish(); }
function finish(){
  const n=R.total, right=Object.values(R.first).filter(Boolean).length;
  const pct=Math.round(right/n*100);
  const msg=pct>=90?'Exam ready! 🏆':pct>=70?'Strong. One more round! 💪':pct>=50?'Getting there. Missed cards will stick now.':'Good start. Do another round, repetition works.';
  $.innerHTML=`
    <div class="score">${right}/${n}</div>
    <p class="center sub">${msg}<br>⭐ ${R.xp} XP · best streak ${mem.best}</p>
    ${R.missed.length?`<h2>Missed (learn these):</h2>${R.missed.map(i=>`<div class="miss">${esc(C[i][1])}<br><b>${esc(C[i][2])}</b>${C[i][3]?`<br>💡 ${esc(C[i][3])}`:''}</div>`).join('')}`:'<p class="center">Perfect round, no misses! 🎉</p>'}
    ${R.missed.length?`<button class="big" data-a="retry">🔁 Retry the ones I missed</button>`:''}
    <button class="big ${R.missed.length?'alt':''}" data-a="smart">▶ Another round</button>
    <button class="big alt" data-a="home">Home</button>`;
}

/* ---------- PICKERS ---------- */
const allIdx=()=>C.map((_,i)=>i);
function smartPool(ids){
  const weak=shuffle(ids.filter(i=>mem.st[i]==='x'));
  const fresh=shuffle(ids.filter(i=>!mem.st[i]));
  const ok=shuffle(ids.filter(i=>mem.st[i]==='o'));
  return [...weak,...fresh,...ok];
}
let lastScope=null;
$.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='pick') pick(+b.dataset.k);
  else if(a==='next') next();
  else if(a==='home') home();
  else if(a==='smart'){ const sc=lastScope&&lastScope.length?lastScope:allIdx(); startRound(smartPool(sc).slice(0,10),'smart',10); }
  else if(a==='topic'){ lastScope=C.map((c,i)=>c[0]===b.dataset.t?i:-1).filter(i=>i>=0); startRound(smartPool(lastScope).slice(0,10),'topic',10); }
  else if(a==='mock'){ lastScope=null; startRound(allIdx(),'mock',30); }
  else if(a==='weak'){ lastScope=null; startRound(allIdx().filter(i=>mem.st[i]==='x'),'weak',10); }
  else if(a==='retry'){ startRound(R.missed.slice(),'retry',10); }
  else if(a==='sstart') sampleStart();
  else if(a==='sreveal') sampleReveal();
  else if(a==='sright') sampleMark(true);
  else if(a==='swrong') sampleMark(false);
  else if(a==='reset'){ if(confirm('Reset all progress?')){ mem={st:{},best:0}; save(); home(); } }
});
document.addEventListener('keydown',e=>{
  if(!R) return;
  if(!R.answered && /^[1-4]$/.test(e.key)) pick(+e.key-1);
  else if(R.answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); }
});
// smart-round button on the home screen is global; on finish it should keep the last scope
const _home=home; home=function(){ lastScope=null; _home(); };
if(location.hash==='#sample-exam') sampleStart(); else home();
</script>
</body>
